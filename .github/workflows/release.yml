name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install

      - name: Type check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Package extension
        run: |
          cd dist
          zip -r ../light-tab-page-${{ github.ref_name }}.zip .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: light-tab-page-${{ github.ref_name }}.zip
          generate_release_notes: true

      # --- Chrome Web Store (需要配置 secrets) ---
